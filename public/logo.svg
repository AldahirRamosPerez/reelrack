<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Cuerpo del carrete (rectángulo redondeado) -->
  <rect x="20" y="30" width="60" height="40" rx="8" fill="url(#grad)" />
  <!-- Agujeros del carrete (círculos) -->
  <circle cx="30" cy="50" r="6" fill="#ffffff" />
  <circle cx="70" cy="50" r="6" fill="#ffffff" />
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
  <!-- Detalles de película (líneas horizontales) -->
  <line x1="20" y1="38" x2="80" y2="38" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="20" y1="62" x2="80" y2="62" stroke="#ffffff" stroke-width="2" opacity="0.6" />
</svg>